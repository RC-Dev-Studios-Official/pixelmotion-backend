name = "pixelmotion-backend"
main = "dist/main.js"
compatibility_date = "2026-09-06"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[alias]
"@nestjs/microservices" = "./empty-module.js"
"@nestjs/microservices/microservices-module" = "./empty-module.js"
"@nestjs/websockets" = "./empty-module.js"
"@nestjs/websockets/socket-module" = "./empty-module.js"
